<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesando Pago...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e5e5;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        p {
            color: #666;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Procesando tu pago...</p>
    </div>
    <script>
        (function() {
            var hash = window.location.hash;
            var search = window.location.search;

            if (search) {
                var params = new URLSearchParams(search);
                var sessionId = params.get('session_id');
                var redirectStatus = params.get('redirect_status');

                var appointmentId = null;
                var pathParts = window.location.pathname.split('/');
                for (var i = 0; i < pathParts.length; i++) {
                    if (pathParts[i] === 'checkout' && pathParts[i + 1]) {
                        appointmentId = pathParts[i + 1];
                        break;
                    }
                }

                if (appointmentId && sessionId && redirectStatus) {
                    var newHash = '#/patient/checkout/' + appointmentId + '?session_id=' + sessionId + '&redirect_status=' + redirectStatus;
                    window.location.replace(window.location.origin + newHash);
                } else if (sessionId && redirectStatus) {
                    window.location.replace(window.location.origin + '/#/patient/cart?session_id=' + sessionId + '&redirect_status=' + redirectStatus);
                } else {
                    window.location.replace(window.location.origin + '/#/patient/cart');
                }
            } else {
                window.location.replace(window.location.origin + '/#/patient/cart');
            }
        })();
    </script>
</body>
</html>
